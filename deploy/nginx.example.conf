# Sample Platform web console — production Nginx layout (plan §6.4).
#
# The SPA is a static build (npm run build → dist/), served directly by
# Nginx. /api goes to the Flask/Gunicorn backend. Legacy Jinja pages keep
# working at / until the strangler migration finishes.

server {
    listen 443 ssl http2;
    server_name sampleplatform.ccextractor.org;

    # --- new web console ---
    location /app/ {
        alias /var/www/sample-platform-web/dist/;
        try_files $uri $uri/ /app/index.html;   # SPA fallback
        expires 1h;
    }
    location /app/assets/ {
        alias /var/www/sample-platform-web/dist/assets/;
        expires 30d;                             # hashed filenames — cache hard
        add_header Cache-Control "public, immutable";
    }

    # --- JSON API (mod_api blueprint) ---
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # --- legacy Flask pages (until Phase 6 cutover) ---
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# NOTE: when serving under /app/, build with:  vite build --base=/app/
# (or set base: "/app/" in vite.config.ts for the prod build)
