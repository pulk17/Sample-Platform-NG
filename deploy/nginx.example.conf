# Sample Platform web console — production Nginx layout (plan §6.4).
#
# The SPA is a static build (npm run build → dist/), served directly by
# Nginx. /api goes to the Flask/Gunicorn backend. Legacy Jinja pages keep
# working at / until the strangler migration finishes.

server {
    listen 80;
    server_name sampleplatform.ccextractor.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sampleplatform.ccextractor.org;

    # --- security headers (apply to every response) ---
    # style-src 'unsafe-inline' is required by the animation library; the
    # rest can stay strict: no third-party scripts, fonts self-hosted,
    # API on the same origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- new web console ---
    location /app/ {
        alias /var/www/sample-platform-web/dist/;
        try_files $uri $uri/ /app/index.html;   # SPA fallback
        expires 1h;
    }
    location /app/assets/ {
        alias /var/www/sample-platform-web/dist/assets/;
        expires 30d;                             # hashed filenames — cache hard
        add_header Cache-Control "public, immutable";
    }

    # --- JSON API (mod_api blueprint) ---
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # --- legacy Flask pages (until Phase 6 cutover) ---
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# NOTE: when serving under /app/, build with:  vite build --base=/app/
# (or set base: "/app/" in vite.config.ts for the prod build)
# NOTE: nginx add_header is not inherited into blocks that set their own
# headers — /app/assets/ redeclares Cache-Control, so if you add headers
# there, repeat the security set or use an include file.
